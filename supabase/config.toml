# Supabase CLI configuration for Weave CV
# See: https://supabase.com/docs/reference/supabase/cli/config

[project]
id = "weave-cv-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Local SMTP for email testing (Inbucket)
[auth.smtp]
admin_email = "admin@localhost"
host = "localhost"
port = 54325
user = "sender"
pass = "fake-secret"
sender_name = "Weave CV"
sender_email = "noreply@localhost"

[storage]
enabled = true
file_size_limit = "50MiB"
